<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>ชนแก้ว by leo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@500;600;700;800&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16121f; --bg-elev:#211a30; --bg-elev-2:#2b2240;
    --line: rgba(245,241,250,0.10);
    --text:#f5f1fa; --text-dim:#b8aecb;
    --pink:#ff4d8d; --amber:#ffb238; --teal:#2fe6c7; --violet:#9b8cff; --lime:#c7f45f; --coral:#ff7a59; --danger:#ff4d4d;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(circle at 15% 0%, rgba(255,77,141,0.12), transparent 45%),
      radial-gradient(circle at 85% 15%, rgba(47,230,199,0.10), transparent 40%),
      var(--bg);
    color:var(--text); font-family:'Sarabun', sans-serif; min-height:100vh; padding-bottom:40px;
  }
  h1,h2,h3{font-family:'Kanit', sans-serif;}
  button{font-family:'Sarabun', sans-serif;}
  .app{max-width:480px; margin:0 auto; padding:0 18px;}
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:22px 0 10px;}
  .brand h1{font-size:26px; font-weight:800; margin:0; letter-spacing:0.2px;}
  .iconbtn{background:var(--bg-elev); border:1px solid var(--line); color:var(--text); width:42px; height:42px; border-radius:13px; font-size:19px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .iconbtn:active{background:var(--bg-elev-2);}
  .card-panel{background:var(--bg-elev); border:1px solid var(--line); border-radius:20px; padding:20px;}
  .muted{color:var(--text-dim); font-size:14.5px; line-height:1.55;}
  .btn{border:none; border-radius:16px; padding:15px 20px; font-family:'Kanit',sans-serif; font-weight:600; font-size:16.5px; cursor:pointer; width:100%; display:flex; align-items:center; justify-content:center; gap:8px;}
  .btn:active{transform:scale(0.98);}
  .btn-primary{background:linear-gradient(135deg,var(--pink),var(--coral)); color:#1a0e14;}
  .btn-secondary{background:var(--bg-elev-2); color:var(--text); border:1px solid var(--line);}
  .btn-teal{background:var(--teal); color:#07211c;}
  .btn-ghost{background:transparent; color:var(--text-dim); border:1px dashed var(--line);}
  .btn-danger-outline{background:transparent; color:var(--danger); border:1px solid rgba(255,77,77,0.4);}
  .btn-sm{padding:10px 14px; font-size:14px; width:auto;}
  .btn:disabled{opacity:0.4; cursor:not-allowed;}
  input[type=text]{width:100%; background:var(--bg); border:1px solid var(--line); color:var(--text); border-radius:12px; padding:13px 14px; font-size:15.5px; font-family:'Sarabun',sans-serif;}
  input[type=text]:focus{outline:2px solid var(--teal); outline-offset:1px;}
  input[type=text].code-input{text-align:center; letter-spacing:4px; font-family:'Kanit'; font-weight:700; font-size:22px; text-transform:uppercase;}
  .section-label{font-family:'Kanit',sans-serif; font-weight:600; font-size:14px; color:var(--text-dim); margin:0 0 10px 2px;}
  .footnote{text-align:center; color:var(--text-dim); font-size:12px; margin-top:22px; line-height:1.6;}

  /* Entry screen */
  .mode-tabs{display:flex; gap:8px; margin-bottom:16px;}
  .mode-tab{flex:1; padding:12px; border-radius:14px; text-align:center; font-family:'Kanit'; font-weight:600; font-size:15px; background:var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--line); cursor:pointer;}
  .mode-tab.active{background:var(--teal); color:#07211c; border-color:var(--teal);}
  .avatar-wrap{position:relative; flex:none; width:64px; height:64px; margin:0 auto 14px;}
  .avatar-lg{width:64px; height:64px; border-radius:20px; object-fit:cover; display:block; background:var(--bg-elev-2); border:1px solid var(--line);}
  .avatar-lg-placeholder{width:64px; height:64px; border-radius:20px; display:flex; align-items:center; justify-content:center; font-size:26px; background:var(--bg-elev-2); border:1px solid var(--line);}
  .photo-btn-lg{position:absolute; right:-4px; bottom:-4px; width:26px; height:26px; border-radius:50%; background:var(--teal); border:2px solid var(--bg); color:#07211c; font-size:13px; display:flex; align-items:center; justify-content:center; cursor:pointer;}

  /* Lobby */
  .code-pill{display:flex; align-items:center; justify-content:center; gap:10px; background:var(--bg-elev-2); border:1px dashed var(--teal); border-radius:16px; padding:16px; margin-bottom:16px;}
  .code-pill .code-val{font-family:'Kanit'; font-weight:800; font-size:28px; letter-spacing:6px; color:var(--teal);}
  .code-pill .copy-btn{background:none; border:none; color:var(--text-dim); font-size:18px; cursor:pointer;}
  .lobby-row{display:flex; align-items:center; gap:10px; padding:10px 4px; border-bottom:1px solid var(--line);}
  .lobby-row:last-child{border-bottom:none;}
  .lobby-avatar{width:40px; height:40px; border-radius:12px; object-fit:cover; flex:none; background:var(--bg-elev-2);}
  .lobby-avatar-ph{width:40px; height:40px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-family:'Kanit'; font-weight:700; font-size:15px; flex:none;}
  .lobby-name{flex:1; font-weight:600; font-family:'Kanit'; font-size:15px; display:flex; align-items:center; gap:6px;}
  .online-dot{width:9px; height:9px; border-radius:50%; background:#555; flex:none;}
  .online-dot.on{background:var(--teal); box-shadow:0 0 6px var(--teal);}
  .crown{font-size:15px;}
  .host-select-btn{font-size:12px; color:var(--text-dim); background:var(--bg-elev-2); border:1px solid var(--line); border-radius:10px; padding:6px 10px; cursor:pointer; font-family:'Kanit';}

  /* Game / cards */
  .round-tag{display:flex; align-items:center; justify-content:space-between; margin:4px 0 16px;}
  .round-tag .num{font-size:14px; color:var(--text-dim); font-family:'Kanit',sans-serif;}
  .cards-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:18px;}
  .flipcard{height:150px; position:relative;}
  .flipcard-inner{position:relative; width:100%; height:100%;}
  .face{position:absolute; inset:0; border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:10px; text-align:center; overflow:hidden;}
  .face-back{background:repeating-linear-gradient(135deg, var(--bg-elev-2) 0 10px, var(--bg-elev) 10px 20px); border:1px solid var(--line); z-index:2; opacity:1; transform:scaleX(1);}
  .face-back.has-photo{padding:0;}
  .face-back .pname{font-family:'Kanit',sans-serif; font-weight:700; font-size:16px; color:var(--text);}
  .face-back .placeholder{font-size:26px; margin-bottom:6px; opacity:0.5;}
  .card-photo-full{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .scrim-bottom{position:absolute; left:0; right:0; bottom:0; height:58%; background:linear-gradient(to top, rgba(0,0,0,0.78), transparent);}
  .overlay-name{position:absolute; bottom:8px; left:4px; right:4px; text-align:center; font-family:'Kanit',sans-serif; font-weight:700; font-size:14px; z-index:2;}
  .face-front{border:1px solid rgba(255,255,255,0.14); z-index:1; opacity:0; transform:scaleX(0.05);}
  .face-front.has-photo{padding:0; background:#000;}
  .face-front .emoji{font-size:32px; margin-bottom:4px;}
  .face-front .tlabel{font-family:'Kanit',sans-serif; font-weight:700; font-size:14.5px;}
  .face-front .pname2{font-family:'Kanit',sans-serif; font-weight:700; font-size:15px; margin-top:6px; background:rgba(0,0,0,0.22); padding:3px 10px; border-radius:20px;}
  .type-badge{position:absolute; top:8px; left:8px; background:rgba(0,0,0,0.45); padding:4px 9px; border-radius:20px; font-family:'Kanit',sans-serif; font-weight:600; font-size:12.5px; z-index:2;}
  .my-card-tag{position:absolute; top:8px; right:8px; background:var(--teal); color:#07211c; padding:3px 9px; border-radius:20px; font-family:'Kanit'; font-weight:700; font-size:11px; z-index:3;}
  .tap-hint{position:absolute; bottom:6px; left:0; right:0; text-align:center; font-size:11px; color:var(--text-dim); font-family:'Kanit'; z-index:2;}
  .flipcard.tappable{cursor:pointer;}
  @keyframes flipOutFace{0%{transform:scaleX(1); opacity:1;} 45%{transform:scaleX(0.05); opacity:1;} 50%{transform:scaleX(0.05); opacity:0;} 100%{transform:scaleX(0.05); opacity:0;}}
  @keyframes flipInFace{0%{transform:scaleX(0.05); opacity:0;} 50%{transform:scaleX(0.05); opacity:0;} 55%{opacity:1;} 100%{transform:scaleX(1); opacity:1;}}
  .flipcard.revealed .face-back{animation: flipOutFace 0.6s ease forwards;}
  .flipcard.revealed .face-front{animation: flipInFace 0.6s ease forwards;}
  .flipcard.battling{animation: pulseGlow 1.4s ease-in-out infinite;}
  @keyframes pulseGlow{0%,100%{filter:drop-shadow(0 0 0px rgba(255,77,141,0));} 50%{filter:drop-shadow(0 0 14px rgba(255,77,141,0.55));}}
  .actions{display:flex; flex-direction:column; gap:10px; margin-top:6px;}

  .battle-panel{border-radius:20px; padding:20px; margin-bottom:18px; background:linear-gradient(160deg, rgba(255,77,141,0.16), rgba(255,178,56,0.08)); border:1px solid rgba(255,77,141,0.3);}
  .battle-title{font-family:'Kanit',sans-serif; font-weight:700; font-size:18px; margin:0 0 4px; display:flex; align-items:center; gap:8px;}
  .vs-names{color:var(--text-dim); font-size:14px; margin-bottom:14px;}
  .waiting-msg{background:rgba(0,0,0,0.2); border-radius:14px; padding:14px; text-align:center; color:var(--text-dim); font-size:14px; margin-bottom:6px;}
  .challenge-box{background:rgba(0,0,0,0.25); border-radius:14px; padding:16px; margin-bottom:16px;}
  .challenge-box .ctag{font-size:12px; color:var(--amber); font-family:'Kanit'; font-weight:600; margin-bottom:6px;}
  .challenge-box .ctext{font-size:17px; line-height:1.5; font-weight:500;}
  .loser-label{font-size:13.5px; color:var(--text-dim); margin-bottom:8px;}
  .loser-picks{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
  .loser-chip{border:1px solid var(--line); background:var(--bg-elev-2); color:var(--text); padding:9px 15px; border-radius:20px; font-size:14.5px; cursor:pointer; font-family:'Kanit'; font-weight:500; display:flex; align-items:center; gap:6px;}
  .loser-chip img{width:20px; height:20px; border-radius:50%; object-fit:cover;}
  .loser-chip.picked{background:var(--danger); border-color:var(--danger); color:#2a0000;}
  .penalty-box{background:rgba(255,77,77,0.12); border:1px solid rgba(255,77,77,0.3); border-radius:14px; padding:16px; margin-bottom:16px;}
  .penalty-box .ptag{font-size:12px; color:var(--danger); font-family:'Kanit'; font-weight:600; margin-bottom:6px;}
  .penalty-box .ptext{font-size:17px; font-weight:600;}
  .penalty-box .pwho{font-size:14px; color:var(--text-dim); margin-top:6px;}
  .no-battle{text-align:center; padding:26px 10px; color:var(--text-dim); font-size:15px;}
  .no-battle .big{font-size:30px; margin-bottom:8px;}
  .host-badge-row{display:flex; align-items:center; gap:6px; margin-bottom:10px;}
  .host-pill{font-size:11px; background:rgba(47,230,199,0.15); color:var(--teal); border:1px solid rgba(47,230,199,0.3); padding:3px 9px; border-radius:20px; font-family:'Kanit'; font-weight:600;}

  /* Full-screen own-card reveal (real 3D flip) */
  .reveal-fullscreen{position:relative; width:100%; min-height:56vh; margin-bottom:16px;}
  .reveal-flip-inner{position:absolute; inset:0;}
  .reveal-face{position:absolute; inset:0; border-radius:24px; overflow:hidden; border:1px solid var(--line); background:var(--bg-elev-2);}
  .reveal-face-back{background:repeating-linear-gradient(135deg, var(--bg-elev-2) 0 12px, var(--bg-elev) 12px 24px); display:flex; align-items:center; justify-content:center; z-index:2; opacity:1; transform:scaleX(1);}
  .reveal-back-icon{font-size:88px; opacity:0.35;}
  .reveal-face-front{background:#000; z-index:1; opacity:0; transform:scaleX(0.05);}
  .reveal-photo{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .reveal-placeholder{position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:84px; opacity:0.35;}
  .reveal-scrim-top{position:absolute; top:0; left:0; right:0; height:30%; background:linear-gradient(to bottom, rgba(0,0,0,0.55), transparent); z-index:3; pointer-events:none;}
  .reveal-scrim-bottom{position:absolute; bottom:0; left:0; right:0; height:42%; background:linear-gradient(to top, rgba(0,0,0,0.85), transparent); z-index:1;}
  .reveal-round-badge{position:absolute; top:14px; left:14px; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:20px; font-family:'Kanit'; font-size:13px; font-weight:600; z-index:4;}
  .reveal-count-badge{position:absolute; top:14px; right:14px; background:rgba(0,0,0,0.5); padding:6px 12px; border-radius:20px; font-family:'Kanit'; font-size:13px; font-weight:600; z-index:4;}
  .reveal-type-badge{position:absolute; top:56px; left:14px; background:rgba(0,0,0,0.55); padding:6px 12px; border-radius:20px; font-family:'Kanit'; font-size:14px; font-weight:700; z-index:4;}
  .reveal-name{position:absolute; bottom:18px; left:0; right:0; text-align:center; font-family:'Kanit'; font-weight:800; font-size:26px; z-index:2;}
  .reveal-sub{position:absolute; bottom:56px; left:0; right:0; text-align:center; font-family:'Kanit'; font-weight:500; font-size:13px; color:var(--text-dim); z-index:2;}
  .reveal-flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; border-radius:24px;}
  .reveal-shimmer{position:absolute; top:-20%; bottom:-20%; width:55%; background:linear-gradient(75deg, transparent, rgba(255,255,255,0.55), transparent); z-index:5; opacity:0; transform:translateX(-160%) rotate(12deg); pointer-events:none;}
  @keyframes revealFlash{0%{opacity:0;} 48%{opacity:0.75;} 100%{opacity:0;}}
  @keyframes revealShimmerSweep{0%{transform:translateX(-160%) rotate(12deg); opacity:0;} 20%{opacity:1;} 80%{opacity:1;} 100%{transform:translateX(160%) rotate(12deg); opacity:0;}}
  .reveal-fullscreen.opening .reveal-flash{animation: revealFlash 0.75s ease;}
  .reveal-fullscreen.opening .reveal-shimmer{animation: revealShimmerSweep 0.75s ease;}
  .reveal-flip-inner.flipped .reveal-face-back{animation: flipOutFace 0.75s ease forwards;}
  .reveal-flip-inner.flipped .reveal-face-front{animation: flipInFace 0.75s ease forwards;}
  .reveal-shine{position:absolute; top:0; left:-60%; width:55%; height:100%; background:linear-gradient(75deg, transparent, rgba(255,255,255,0.38), transparent); transform:skewX(-15deg); animation: shineSweep 0.85s ease forwards; z-index:2;}
  @keyframes shineSweep{from{left:-60%;} to{left:150%;}}
  .reveal-result-badge{position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.4); opacity:0; background:rgba(10,7,16,0.6); backdrop-filter:blur(3px); border:1px solid rgba(255,255,255,0.18); border-radius:24px; padding:22px 32px; text-align:center; z-index:3; animation: popIn 0.55s cubic-bezier(.34,1.56,.64,1) forwards; animation-delay:0.18s;}
  .reveal-result-badge .r-emoji{font-size:54px; display:block; margin-bottom:8px;}
  .reveal-result-badge .r-label{font-family:'Kanit'; font-weight:800; font-size:21px; color:#fff;}
  @keyframes popIn{0%{transform:translate(-50%,-50%) scale(0.4); opacity:0;} 60%{transform:translate(-50%,-50%) scale(1.14); opacity:1;} 100%{transform:translate(-50%,-50%) scale(1); opacity:1;}}

  /* Settings modal */
  .overlay{position:fixed; inset:0; background:rgba(10,7,16,0.72); backdrop-filter:blur(2px); display:flex; align-items:flex-end; justify-content:center; z-index:50;}
  .sheet{width:100%; max-width:480px; background:var(--bg-elev); border-radius:24px 24px 0 0; padding:18px 18px 26px; max-height:88vh; overflow-y:auto; border-top:1px solid var(--line);}
  .sheet-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .sheet-head h2{font-size:20px; margin:0;}
  .tabs{display:flex; gap:6px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .tab{flex:none; padding:9px 14px; border-radius:12px; font-size:13.5px; font-family:'Kanit'; font-weight:600; background:var(--bg-elev-2); color:var(--text-dim); border:1px solid var(--line); cursor:pointer;}
  .tab.active{background:var(--teal); color:#07211c; border-color:var(--teal);}
  .list-item{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .list-item .txt{flex:1; font-size:14.5px; background:var(--bg); padding:11px 13px; border-radius:12px; border:1px solid var(--line);}
  .type-chip-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; background:var(--bg); border:1px solid var(--line); border-radius:12px; padding:8px 10px;}
  .type-chip-row .em{width:34px; text-align:center; font-size:18px;}
  .type-chip-row input{border:none; background:transparent; padding:4px 0;}
  .add-row{display:flex; gap:8px; margin-top:4px; margin-bottom:20px;}
  .add-row input{flex:1;}
  .add-row button{flex:none; width:46px; border-radius:12px; border:none; background:var(--teal); color:#07211c; font-size:19px; font-weight:700; cursor:pointer;}
  .del-x{width:36px; height:36px; flex:none; border-radius:11px; border:none; background:var(--bg-elev-2); color:var(--text-dim); font-size:16px; cursor:pointer;}
  .loading-screen{padding:70px 0; text-align:center; color:var(--text-dim); font-family:'Kanit'; font-size:15px;}
  .error-box{background:rgba(255,77,77,0.12); border:1px solid rgba(255,77,77,0.3); color:#ffb3b3; padding:12px 14px; border-radius:12px; font-size:13.5px; margin-bottom:14px;}
</style>
</head>

  'แข่งวาดรูปตามโจทย์ที่เพื่อนตั้งให้ ภายใน 20 วินาที',
  'ทำหน้าตลกที่สุดค้างไว้ 5 วินาที ใครยิ้มก่อนแพ้',
];
const DEFAULT_PENALTIES = [
  'ดื่ม 1 shot','ดื่ม 3 อึก','ดื่มครึ่งแก้ว','เต้นท่าฮาๆ 10 วินาที','ทำเสียงไก่ขัน 3 ครั้ง',
  'ให้เพื่อนถ่ายรูปหน้าตลกไว้ 1 ใบ','พูดขอโทษเป็นภาษาต่างดาว 5 คำ','ทำท่าซูเปอร์ฮีโร่ค้างไว้ 5 วินาที',
  'เล่นมุกฮาให้กลุ่มฟัง 1 มุก','โดนเพื่อนเลือกเพลงให้ร้อง 1 ท่อน',
];
const AVATAR_COLORS = ['var(--pink)','var(--teal)','var(--amber)','var(--violet)','var(--lime)','var(--coral)'];
const ROOM_CODE_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

/* ============ Local identity helpers ============ */
function getDeviceId(){
  let id = localStorage.getItem('chonkaew_device_id');
  if(!id){ id = 'd_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem('chonkaew_device_id', id); }
  return id;
}
function loadProfile(){
  try{ const raw = localStorage.getItem('chonkaew_profile'); return raw ? JSON.parse(raw) : {name:'', photo:null}; }
  catch(e){ return {name:'', photo:null}; }
}
function saveProfile(name, photo){
  try{ localStorage.setItem('chonkaew_profile', JSON.stringify({name, photo})); }catch(e){}
}

/* ============ State ============ */
const profile = loadProfile();
let state = {
  screen: 'connecting', // connecting | entry | lobby | game
  myId: getDeviceId(),
  myName: profile.name || '',
  myPhoto: profile.photo || null,
  entryMode: 'create', // create | join
  joinCodeInput: '',
  entryError: '',
  roomCode: null,
  room: null, // mirrored live room data
  settingsOpen: false,
  settingsTab: 'types',
  saveStatus: null,
  revealAnimating: false
};
let roomListenerRef = null;

/* ============ Utilities ============ */
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function generateRoomCode(){ let c=''; for(let i=0;i<5;i++) c+=ROOM_CODE_CHARS[Math.floor(Math.random()*ROOM_CODE_CHARS.length)]; return c; }
function isHost(){ return !!(state.room && state.room.meta && state.room.meta.hostId === state.myId); }
function myRoomRef(path){ return fbDb.ref('rooms/'+state.roomCode+(path?'/'+path:'')); }

/* ============ Photo capture (for my own profile) ============ */
function compressImage(file, maxSize, quality){
  return new Promise((resolve, reject)=>{
    const objectUrl = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        let w=img.width, h=img.height;
        const scale = Math.min(1, maxSize/Math.max(w,h));
        w=Math.round(w*scale); h=Math.round(h*scale);
        const canvas = document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        const result = canvas.toDataURL('image/jpeg', quality);
        canvas.width=0; canvas.height=0; // release canvas buffer promptly
        URL.revokeObjectURL(objectUrl);
        resolve(result);
      }catch(err){
        URL.revokeObjectURL(objectUrl);
        reject(err);
      }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(objectUrl); reject(new Error('อ่านรูปไม่สำเร็จ')); };
    img.src = objectUrl;
  });
}
async function handleMyPhotoFile(file){
  if(!file) return;
  try{
    const dataUrl = await compressImage(file, 220, 0.72);
    state.myPhoto = dataUrl;
    saveProfile(state.myName, state.myPhoto);
    if(state.roomCode){ await myRoomRef('players/'+state.myId+'/photo').set(dataUrl); }
    render();
  }catch(e){
    console.error(e);
    state.entryError = 'ใส่รูปไม่สำเร็จ (อาจเพราะรูปใหญ่เกินไปหรือหน่วยความจำเครื่องเหลือน้อย) ลองปิดแท็บ/แอปอื่นแล้วลองใหม่ หรือเลือกรูปที่มีขนาดเล็กลง';
    render();
  }
}

/* ============ Settings template (persists across rooms) ============ */
const TEMPLATE_PATH = 'templates/mainSettings';
async function loadTemplateSettings(){
  try{
    const snap = await fbDb.ref(TEMPLATE_PATH).once('value');
    if(snap.exists()){
      const v = snap.val();
      return {
        cardTypes: (Array.isArray(v.cardTypes) && v.cardTypes.length>=2) ? v.cardTypes : DEFAULT_TYPES,
        challenges: (Array.isArray(v.challenges) && v.challenges.length) ? v.challenges : DEFAULT_CHALLENGES,
        penalties: (Array.isArray(v.penalties) && v.penalties.length) ? v.penalties : DEFAULT_PENALTIES
      };
    }
  }catch(e){ console.error('โหลดค่าเริ่มต้นที่บันทึกไว้ไม่สำเร็จ', e); }
  return { cardTypes: DEFAULT_TYPES, challenges: DEFAULT_CHALLENGES, penalties: DEFAULT_PENALTIES };
}
async function saveAsTemplate(){
  if(!state.room) return;
  try{
    await fbDb.ref(TEMPLATE_PATH).set({
      cardTypes: state.room.settings.cardTypes,
      challenges: state.room.settings.challenges,
      penalties: state.room.settings.penalties
    });
  }catch(e){ console.error('บันทึกค่าเริ่มต้นไม่สำเร็จ', e); }
}

/* ============ Room lifecycle ============ */
async function createRoom(){
  state.entryError='';
  if(!fbDb){ state.entryError='โหลด Firebase SDK ไม่สำเร็จ — ถ้าเปิดจากแอป LINE/Messenger ลองกด "เปิดใน Chrome/Safari" แทน หรือปิด Ad-blocker แล้วลองใหม่'; render(); return; }
  if(!state.myName.trim() && !state.myPhoto){ state.entryError='กรอกชื่อ หรือใส่รูปตัวเองก่อนครับ'; render(); return; }
  const code = generateRoomCode();
  saveProfile(state.myName, state.myPhoto);
  const templateSettings = await loadTemplateSettings();
  const roomData = {
    meta:{ hostId: state.myId, createdAt: Date.now(), status:'lobby', roundNumber:0 },
    players:{ [state.myId]:{ name: state.myName.trim(), photo: state.myPhoto||null, online:true, lastSeen: Date.now() } },
    settings: templateSettings,
    piles:{ challengePile: [], penaltyPile: [] },
    playCounts: {},
    round: null
  };
  try{
    await fbDb.ref('rooms/'+code).set(roomData);
    enterRoom(code);
  }catch(e){
    console.error(e);
    state.entryError='สร้างห้องไม่สำเร็จ: ' + (e && e.message ? e.message : 'ไม่ทราบสาเหตุ');
    render();
  }
}

async function joinRoom(){
  state.entryError='';
  if(!fbDb){ state.entryError='โหลด Firebase SDK ไม่สำเร็จ — ถ้าเปิดจากแอป LINE/Messenger ลองกด "เปิดใน Chrome/Safari" แทน หรือปิด Ad-blocker แล้วลองใหม่'; render(); return; }
  const code = (state.joinCodeInput||'').trim().toUpperCase();
  if(!code){ state.entryError='กรอกรหัสห้องก่อนครับ'; render(); return; }
  if(!state.myName.trim() && !state.myPhoto){ state.entryError='กรอกชื่อ หรือใส่รูปตัวเองก่อนครับ'; render(); return; }
  try{
    const snap = await fbDb.ref('rooms/'+code+'/meta').once('value');
    if(!snap.exists()){ state.entryError='ไม่พบห้องนี้ ตรวจสอบรหัสอีกครั้ง'; render(); return; }
    saveProfile(state.myName, state.myPhoto);
    await fbDb.ref('rooms/'+code+'/players/'+state.myId).set({ name: state.myName.trim(), photo: state.myPhoto||null, online:true, lastSeen: Date.now() });
    enterRoom(code);
  }catch(e){
    console.error(e);
    state.entryError='เข้าห้องไม่สำเร็จ: ' + (e && e.message ? e.message : 'ไม่ทราบสาเหตุ');
    render();
  }
}

function enterRoom(code){
  state.roomCode = code;
  localStorage.setItem('chonkaew_room_code', code);
  attachRoomListener();
  setupPresence();
  state.screen='lobby';
  render();
}

/* ============ Render scheduling (avoid redrawing mid-click/tap) ============ */
let pointerDown = false;
let renderQueued = false;
function flushQueuedRender(){ if(renderQueued){ renderQueued=false; render(); } }
document.addEventListener('mousedown', ()=>{ pointerDown=true; }, true);
document.addEventListener('touchstart', ()=>{ pointerDown=true; }, true);
document.addEventListener('mouseup', ()=>{ pointerDown=false; setTimeout(flushQueuedRender,0); }, true);
document.addEventListener('touchend', ()=>{ pointerDown=false; setTimeout(flushQueuedRender,0); }, true);
function scheduleRender(){
  if(pointerDown){ renderQueued=true; return; }
  render();
}

function attachRoomListener(){
  if(roomListenerRef) roomListenerRef.off();
  roomListenerRef = fbDb.ref('rooms/'+state.roomCode);
  roomListenerRef.on('value', snap=>{
    if(!snap.exists()){
      state.room=null; state.roomCode=null; state.screen='entry';
      localStorage.removeItem('chonkaew_room_code');
      scheduleRender(); return;
    }
    state.room = snap.val();
    if(state.room.meta && state.room.meta.status==='playing') state.screen='game';
    else if(state.screen==='connecting' || state.screen==='game') state.screen='lobby';
    scheduleRender();
  });
}

function setupPresence(){
  const myRef = fbDb.ref('rooms/'+state.roomCode+'/players/'+state.myId);
  myRef.update({online:true, lastSeen:Date.now()});
  myRef.onDisconnect().update({online:false, lastSeen:Date.now()});
}

async function leaveRoom(){
  if(roomListenerRef) roomListenerRef.off();
  roomListenerRef = null;
  try{ await fbDb.ref('rooms/'+state.roomCode+'/players/'+state.myId).update({online:false}); }catch(e){}
  localStorage.removeItem('chonkaew_room_code');
  state.roomCode=null; state.room=null; state.screen='entry';
  render();
}

async function tryAutoRejoin(){
  const savedCode = localStorage.getItem('chonkaew_room_code');
  if(!savedCode || !FIREBASE_ENABLED){ state.screen='entry'; render(); return; }
  try{
    const snap = await fbDb.ref('rooms/'+savedCode+'/players/'+state.myId).once('value');
    if(snap.exists()){ enterRoom(savedCode); return; }
  }catch(e){ /* fall through */ }
  localStorage.removeItem('chonkaew_room_code');
  state.screen='entry'; render();
}

async function transferHost(newHostId){
  if(!isHost()) return;
  await myRoomRef('meta/hostId').set(newHostId);
}

/* ============ Game flow (one random pair battles per round) ============ */
async function hostStartGame(){
  if(!isHost()) return;
  const playerIds = Object.keys(state.room.players||{});
  if(playerIds.length<2) return;
  await dealNewRound();
  await myRoomRef('meta').update({status:'playing'});
}

async function dealNewRound(){
  const types = state.room.settings.cardTypes;
  const playerIds = Object.keys(state.room.players||{});
  const counts = state.room.playCounts || {};
  // shuffle first (for randomness among ties), then sort by fewest past battles so
  // everyone gets a turn before anyone repeats
  const sorted = shuffle(playerIds).sort((a,b)=> (counts[a]||0) - (counts[b]||0));
  const pairIds = sorted.slice(0,2);
  const type = types[Math.floor(Math.random()*types.length)];
  const assignments = {}; const opened = {};
  pairIds.forEach(pid=>{ assignments[pid]=type.id; opened[pid]=false; });
  const newRoundNum = ((state.room.meta && state.room.meta.roundNumber)||0)+1;
  const newCounts = {...counts};
  pairIds.forEach(pid=>{ newCounts[pid] = (newCounts[pid]||0)+1; });
  await myRoomRef().update({
    'round': { number:newRoundNum, pairIds, assignments, opened, battle:null },
    'meta/roundNumber': newRoundNum,
    'playCounts': newCounts
  });
}

async function openMyCard(){
  if(!state.room.round) return;
  await myRoomRef('round/opened/'+state.myId).set(true);
}

function handleRevealOpenClick(){
  if(state.revealAnimating) return;
  state.revealAnimating = true;
  render();
  setTimeout(()=>{
    openMyCard();
    state.revealAnimating = false;
  }, 800);
}

async function hostOpenAll(){
  if(!isHost() || !state.room.round) return;
  const updates = {};
  (state.room.round.pairIds||[]).forEach(pid=>{ updates['round/opened/'+pid] = true; });
  await myRoomRef().update(updates);
}

function battleIsReady(){
  const round = state.room && state.room.round; if(!round) return false;
  const pairIds = round.pairIds || [];
  return pairIds.length===2 && pairIds.every(pid => round.opened && round.opened[pid]);
}

async function hostOpenChallenge(){
  if(!isHost() || !battleIsReady()) return;
  const round = state.room.round;
  if(round.battle) return; // already opened
  let pile = (state.room.piles && state.room.piles.challengePile) || [];
  const challenges = (state.room.settings && state.room.settings.challenges) || [];
  if(challenges.length===0) return;
  if(pile.length===0) pile = shuffle(challenges);
  const text = pile.pop();
  await myRoomRef('piles/challengePile').set(pile);
  await myRoomRef('round/battle').set({ playerIds: round.pairIds, state:'challenge_active', challengeText:text, loserIds:[], penaltyText:null });
}

async function hostToggleLoser(pid){
  if(!isHost()) return;
  const b = state.room.round.battle;
  if(!b || b.state==='resolved') return;
  let losers = b.loserIds||[];
  losers = losers.includes(pid) ? losers.filter(x=>x!==pid) : [...losers, pid];
  await myRoomRef('round/battle/loserIds').set(losers);
}

async function hostConfirmPenalty(){
  if(!isHost()) return;
  const b = state.room.round.battle;
  if(!b || !b.loserIds || b.loserIds.length===0) return;
  let pile = (state.room.piles && state.room.piles.penaltyPile) || [];
  const penalties = (state.room.settings && state.room.settings.penalties) || [];
  if(penalties.length===0) return;
  if(pile.length===0) pile = shuffle(penalties);
  const text = pile.pop();
  await myRoomRef('piles/penaltyPile').set(pile);
  await myRoomRef('round/battle').update({ state:'resolved', penaltyText:text });
}

function allBattlesResolved(){
  const round = state.room && state.room.round; if(!round) return false;
  return !!(round.battle && round.battle.state==='resolved');
}
async function hostNextRound(){
  if(!isHost() || !allBattlesResolved()) return;
  await dealNewRound();
}

/* ============ Settings (room-wide, editable by anyone) ============ */
function openSettings(tab){ state.settingsOpen=true; state.settingsTab=tab||'types'; render(); }
function closeSettings(){ state.settingsOpen=false; render(); }

async function addType(emoji, label){
  if(!label.trim() || !state.room) return;
  const color = AVATAR_COLORS[state.room.settings.cardTypes.length % AVATAR_COLORS.length];
  const list = [...state.room.settings.cardTypes, {id:'t_'+Date.now(), emoji: emoji||'🎴', label:label.trim(), color}];
  await myRoomRef('settings/cardTypes').set(list);
  saveAsTemplate();
}
async function removeType(id){
  if(!state.room || state.room.settings.cardTypes.length<=2) return;
  const list = state.room.settings.cardTypes.filter(t=>t.id!==id);
  await myRoomRef('settings/cardTypes').set(list);
  saveAsTemplate();
}
async function updateTypeLabel(id, val){
  const list = state.room.settings.cardTypes.map(t=> t.id===id ? {...t, label:val} : t);
  await myRoomRef('settings/cardTypes').set(list);
  saveAsTemplate();
}
async function addChallenge(text){
  if(!text.trim() || !state.room) return;
  const list = [...state.room.settings.challenges, text.trim()];
  await myRoomRef('settings/challenges').set(list);
  saveAsTemplate();
}
async function removeChallenge(idx){
  const list = state.room.settings.challenges.filter((_,i)=>i!==idx);
  await myRoomRef('settings/challenges').set(list);
  saveAsTemplate();
}
async function addPenalty(text){
  if(!text.trim() || !state.room) return;
  const list = [...state.room.settings.penalties, text.trim()];
  await myRoomRef('settings/penalties').set(list);
  saveAsTemplate();
}
async function removePenalty(idx){
  const list = state.room.settings.penalties.filter((_,i)=>i!==idx);
  await myRoomRef('settings/penalties').set(list);
  saveAsTemplate();
}

/* ============ Rendering ============ */
function typeById(id){ return state.room && state.room.settings.cardTypes.find(t=>t.id===id); }
function playerName(pid){ const p = state.room && state.room.players && state.room.players[pid]; return p ? (p.name||'ผู้เล่น') : 'ผู้เล่น'; }
function playerPhoto(pid){ const p = state.room && state.room.players && state.room.players[pid]; return p ? p.photo : null; }

function render(){
  const app = document.getElementById('app');
  if(!FIREBASE_ENABLED){
    app.innerHTML = `<div class="loading-screen">⚠️ ยังไม่ได้เชื่อมต่อ Firebase<br/>โหมดผู้เล่นหลายคนต้องใช้ Firebase เท่านั้น</div>`;
    return;
  }
  if(state.screen==='connecting'){
    app.innerHTML = `<div class="loading-screen">กำลังเชื่อมต่อ...</div>`;
    return;
  }
  let body = '';
  if(state.screen==='entry') body = renderEntry();
  else if(state.screen==='lobby') body = renderLobby();
  else if(state.screen==='game') body = renderGame();

  app.innerHTML = `
    <div class="topbar">
      <div class="brand"><h1>ชนแก้ว by leo</h1></div>
      ${state.screen!=='entry' ? `<button class="iconbtn" onclick="openSettings('types')">⚙️</button>` : ''}
    </div>
    ${body}
    <div class="footnote">เล่นอย่างสนุกและดื่มอย่างมีสติ · สำหรับผู้มีอายุ 20 ปีขึ้นไป<br/>🟢 ซิงก์แบบเรียลไทม์ผ่าน Firebase</div>
  `;
  if(state.settingsOpen && state.room) app.innerHTML += renderSettings();
  bindEvents();
}

function renderProfileEditor(){
  const avatar = state.myPhoto
    ? `<img class="avatar-lg" src="${state.myPhoto}">`
    : `<div class="avatar-lg-placeholder">🙂</div>`;
  return `
    <div class="avatar-wrap">
      ${avatar}
      <button class="photo-btn-lg" id="my-photo-btn">📷</button>
      <input type="file" accept="image/*" capture="user" id="my-photo-input" style="display:none">
    </div>
    <input type="text" id="my-name-input" placeholder="ชื่อของคุณ" value="${esc(state.myName)}" style="margin-bottom:14px;" />
  `;
}

function renderEntry(){
  return `
    <div class="card-panel">
      <div class="mode-tabs">
        <div class="mode-tab ${state.entryMode==='create'?'active':''}" data-mode="create">สร้างห้อง</div>
        <div class="mode-tab ${state.entryMode==='join'?'active':''}" data-mode="join">เข้าห้อง</div>
      </div>

      ${state.entryError ? `<div class="error-box">${esc(state.entryError)}</div>` : ''}
      <button class="btn btn-primary" id="entry-action-btn">${state.entryMode==='create' ? '🎉 สร้างห้องใหม่' : '🚪 เข้าห้อง'}</button>
    </div>
  `;
}

function renderLobby(){
  const players = state.room.players || {};
  const pids = Object.keys(players);
  const hostId = state.room.meta.hostId;
  const iAmHost = isHost();

  const rows = pids.map(pid=>{
    const p = players[pid];
    const avatar = p.photo ? `<img class="lobby-avatar" src="${p.photo}">` : `<div class="lobby-avatar-ph" style="background:${AVATAR_COLORS[pid.length%AVATAR_COLORS.length]}">${esc((p.name||'?').trim()[0]||'?').toUpperCase()}</div>`;
    return `
      <div class="lobby-row">
        ${avatar}
        <div class="lobby-name">
          <span class="online-dot ${p.online?'on':''}"></span>
          ${esc(p.name||'ผู้เล่น')}
          ${pid===hostId ? '<span class="crown">👑</span>' : ''}
        </div>
        ${iAmHost && pid!==hostId ? `<button class="host-select-btn" data-transfer-host="${pid}">ตั้งเป็น Host</button>` : ''}
      </div>
    `;
  }).join('');

  return `
    <div class="code-pill">
      <div>
        <div class="muted" style="margin-bottom:2px;">รหัสห้อง</div>
        <div class="code-val">${esc(state.roomCode)}</div>
      </div>
      <button class="copy-btn" id="copy-code-btn" title="คัดลอก">📋</button>
    </div>
    <div class="card-panel">
      <div class="section-label">ผู้เล่น (${pids.length})</div>
      ${rows}
    </div>
    <div style="height:16px"></div>
    ${iAmHost
      ? `<button class="btn btn-primary" id="host-start-btn" ${pids.length<2?'disabled':''}>🚀 เริ่มเกม</button>`
      : `<div class="waiting-msg">⏳ รอ Host เริ่มเกม...</div>`
    }
    ${pids.length<2 && iAmHost ? `<div class="muted" style="text-align:center;margin-top:10px;">ต้องมีผู้เล่นอย่างน้อย 2 คน</div>` : ''}
    <div style="height:10px"></div>
    <button class="btn btn-ghost" id="leave-room-btn">ออกจากห้อง</button>
  `;
}

function renderMyCardReveal(){
  const round = state.room.round;
  const pids = Object.keys(state.room.players||{});
  const myPhoto = playerPhoto(state.myId);
  const myName = playerName(state.myId);
  const animating = state.revealAnimating;
  const myType = typeById(round.assignments[state.myId]) || {emoji:'🎴', label:''};
  return `
    <div class="reveal-fullscreen ${animating?'opening':''}">
      <div class="reveal-flip-inner ${animating?'flipped':''}">
        <div class="reveal-face reveal-face-back">
          ${myPhoto ? `<img class="reveal-photo" src="${myPhoto}">` : `<div class="reveal-placeholder">🎴</div>`}
          <div class="reveal-scrim-bottom"></div>
          <div class="reveal-sub">ชื่อ</div>
          <div class="reveal-name">${esc(myName)}</div>
        </div>
        <div class="reveal-face reveal-face-front">
          ${myPhoto ? `<img class="reveal-photo" src="${myPhoto}">` : `<div class="reveal-placeholder">🎴</div>`}
          <div class="reveal-scrim-bottom"></div>
          <div class="reveal-type-badge">${myType.emoji} ${esc(myType.label)}</div>
          <div class="reveal-sub">ชื่อ</div>
          <div class="reveal-name">${esc(myName)}</div>
        </div>
      </div>
      <div class="reveal-scrim-top"></div>
      <div class="reveal-shimmer"></div>
      <div class="reveal-flash"></div>
      <div class="reveal-round-badge">รอบที่ ${round.number}</div>
      <div class="reveal-count-badge">จำนวนผู้เล่น ${pids.length} คน</div>
    </div>
    <button class="btn btn-primary" id="reveal-open-btn" ${animating?'disabled':''}>${animating?'กำลังเปิด...':'เปิดการ์ด 🔓'}</button>
    <div style="height:10px"></div>
    <button class="btn btn-ghost" id="leave-room-btn" ${animating?'disabled':''}>ออกจากห้อง</button>
  `;
}

function renderGame(){
  const round = state.room.round;
  if(!round) return `<div class="loading-screen">กำลังเตรียมรอบ...</div>`;
  const pairIds = round.pairIds || [];
  const amInPair = pairIds.includes(state.myId);

  if(amInPair && !(round.opened && round.opened[state.myId])){
    return renderMyCardReveal();
  }

  const players = state.room.players || {};
  const allPids = Object.keys(players);
  const spectatorIds = allPids.filter(pid => !pairIds.includes(pid));
  const iAmHost = isHost();
  const bothOpened = battleIsReady();
  const battle = round.battle;

  const cardsHtml = pairIds.map(pid=>{
    const tid = round.assignments[pid];
    const t = typeById(tid) || {emoji:'🎴', label:'', color:AVATAR_COLORS[0]};
    const isOpened = !!(round.opened && round.opened[pid]);
    const isMe = pid===state.myId;
    const photo = playerPhoto(pid);
    const name = playerName(pid);

    const backInner = photo
      ? `<img class="card-photo-full" src="${photo}"><div class="scrim-bottom"></div><div class="overlay-name">${esc(name)}</div>`
      : `<div class="placeholder">🎴</div><div class="pname">${esc(name)}</div>`;
    const frontInner = photo
      ? `<img class="card-photo-full" src="${photo}"><div class="scrim-bottom"></div><div class="type-badge">${t.emoji} ${esc(t.label)}</div><div class="overlay-name">${esc(name)}</div>`
      : `<div class="emoji">${t.emoji}</div><div class="tlabel">${esc(t.label)}</div><div class="pname2">${esc(name)}</div>`;

    return `
      <div class="flipcard ${isOpened?'revealed':''} battling">
        <div class="flipcard-inner">
          <div class="face face-back ${photo?'has-photo':''}" style="${photo?'':'border-top:4px solid '+AVATAR_COLORS[allPids.indexOf(pid)%AVATAR_COLORS.length]+';'}">
            ${backInner}
            ${isMe ? `<div class="my-card-tag">คุณ</div>` : ''}
          </div>
          <div class="face face-front ${photo?'has-photo':''}" style="${photo?'':'background:linear-gradient(160deg, '+t.color+', rgba(0,0,0,0.35)); color:#160f1e;'}">
            ${frontInner}
            ${isMe ? `<div class="my-card-tag">คุณ</div>` : ''}
          </div>
        </div>
      </div>
    `;
  }).join('');

  const pairNames = pairIds.map(pid=>playerName(pid)).join(' ⚡ ');
  let battleHtml = '';

  if(!bothOpened){
    battleHtml = `<div class="waiting-msg">⏳ รอ ${esc(pairNames)} เปิดการ์ดของตัวเองให้ครบก่อน...</div>`;
  } else if(!battle){
    const t = typeById(round.assignments[pairIds[0]]);
    battleHtml = `
      <div class="battle-panel">
        <div class="battle-title">⚠️ พบการ์ดเหมือนกัน — ${t.emoji} ${esc(t.label)}</div>
        <div class="vs-names">${esc(pairNames)}</div>
        ${iAmHost
          ? `<button class="btn btn-secondary" id="open-challenge-btn">🔥 เปิด Challenge</button>`
          : `<div class="waiting-msg">⏳ รอ Host เปิด Challenge...</div>`
        }
      </div>
    `;
  } else {
    const t = typeById(round.assignments[pairIds[0]]);
    const chips = pairIds.map(pid=>{
      const photo = playerPhoto(pid);
      const picked = (battle.loserIds||[]).includes(pid);
      const thumb = photo ? `<img src="${photo}">` : '';
      return `<button class="loser-chip ${picked?'picked':''}" ${iAmHost && battle.state!=='resolved' ? `data-loser-player="${pid}"` : 'disabled'}>${thumb}${esc(playerName(pid))}</button>`;
    }).join('');
    const loserNames = (battle.loserIds||[]).map(pid=>playerName(pid)).join(', ');

    battleHtml = `
      <div class="battle-panel">
        <div class="battle-title">${t.emoji} ${esc(t.label)} ปะทะ!</div>
        <div class="vs-names">${esc(pairNames)}</div>
        <div class="challenge-box">
          <div class="ctag">การ์ดชาเลนจ์</div>
          <div class="ctext">${esc(battle.challengeText)}</div>
        </div>
        ${battle.state!=='resolved' ? `
          ${iAmHost ? `
            <div class="loser-label">แตะเลือกคนที่แพ้ (เลือกได้มากกว่า 1)</div>
            <div class="loser-picks">${chips}</div>
            <button class="btn btn-secondary" id="confirm-penalty-btn" ${(battle.loserIds||[]).length===0?'disabled':''}>ยืนยันการลงโทษ 🃏</button>
          ` : `<div class="waiting-msg">⏳ รอ Host ตัดสินผล...</div>`}
        ` : `
          <div class="loser-picks">${chips}</div>
          <div class="penalty-box">
            <div class="ptag">⚠️ PENALTY</div>
            <div class="ptext">${esc(battle.penaltyText)}</div>
            <div class="pwho">สำหรับ: ${esc(loserNames)}</div>
          </div>
        `}
      </div>
    `;
  }

  const canNextRound = allBattlesResolved();
  const spectatorNames = spectatorIds.map(pid=>playerName(pid)).join(', ');

  return `
    <div class="round-tag">
      <div class="num">รอบที่ ${round.number}</div>
      <div class="num">${allPids.length} ผู้เล่น</div>
    </div>
    ${isHost() ? `<div class="host-badge-row"><span class="host-pill">👑 คุณคือ Host</span></div>` : ''}
    <div class="cards-grid">${cardsHtml}</div>
    ${battleHtml}
    ${spectatorIds.length ? `<div class="muted" style="text-align:center;margin-bottom:14px;">🎲 รอบนี้ไม่ได้ลงเล่น: ${esc(spectatorNames)}</div>` : ''}
    <div class="actions">
      ${isHost() ? `<button class="btn btn-ghost" id="host-open-all-btn">👑 เปิดการ์ดทั้งหมด</button>` : ''}
      ${isHost()
        ? `<button class="btn btn-teal" id="next-round-btn" ${canNextRound?'':'disabled'}>▶️ รอบถัดไป (สุ่มคู่ใหม่)</button>`
        : `<div class="waiting-msg">⏳ รอ Host เริ่มรอบถัดไป...</div>`
      }
      <button class="btn btn-ghost" id="leave-room-btn">ออกจากห้อง</button>
    </div>
  `;
}

function renderSettings(){
  const tab = state.settingsTab;
  const s = state.room.settings;
  let body = '';
  if(tab==='types'){
    body = `
      <div class="muted" style="margin-bottom:12px;">ประเภทการ์ดที่ผู้เล่นจะจั่ว ต้องมีอย่างน้อย 2 ประเภท — แก้แล้วซิงก์ให้ทุกคนในห้องทันที</div>
      ${s.cardTypes.map(t=>`
        <div class="type-chip-row">
          <div class="em">${t.emoji}</div>
          <input type="text" value="${esc(t.label)}" data-type-id="${t.id}" class="type-label-input" />
          <button class="del-x" data-remove-type="${t.id}" ${s.cardTypes.length<=2?'disabled':''}>✕</button>
        </div>
      `).join('')}
      <div class="add-row">
        <input type="text" id="new-type-emoji" placeholder="อีโมจิ" style="flex:none;width:64px;text-align:center;" maxlength="4" />
        <input type="text" id="new-type-label" placeholder="ชื่อประเภทการ์ด..." />
        <button id="add-type-btn">＋</button>
      </div>
    `;
  } else if(tab==='challenges'){
    body = `
      <div class="muted" style="margin-bottom:12px;">การ์ดชาเลนจ์/คำถาม จั่วเมื่อ Host เปิด Battle</div>
      ${s.challenges.map((c,i)=>`
        <div class="list-item"><div class="txt">${esc(c)}</div><button class="del-x" data-remove-challenge="${i}">✕</button></div>
      `).join('')}
      <div class="add-row">
        <input type="text" id="new-challenge-input" placeholder="พิมพ์การ์ดชาเลนจ์ใหม่..." />
        <button id="add-challenge-btn">＋</button>
      </div>
    `;
  } else if(tab==='penalties'){
    body = `
      <div class="muted" style="margin-bottom:12px;">บทลงโทษสำหรับผู้แพ้ Battle</div>
      ${s.penalties.map((c,i)=>`
        <div class="list-item"><div class="txt">${esc(c)}</div><button class="del-x" data-remove-penalty="${i}">✕</button></div>
      `).join('')}
      <div class="add-row">
        <input type="text" id="new-penalty-input" placeholder="พิมพ์บทลงโทษใหม่..." />
        <button id="add-penalty-btn">＋</button>
      </div>
    `;
  }
  return `
    <div class="overlay" id="settings-overlay">
      <div class="sheet">
        <div class="sheet-head"><h2>ตั้งค่าห้อง</h2><button class="iconbtn" id="close-settings-btn">✕</button></div>
        <div class="muted" style="margin-bottom:14px;">✓ แก้ตรงนี้แล้วจะจำไว้เป็นค่าเริ่มต้น ห้องใหม่ที่สร้างครั้งหน้าจะใช้ชุดนี้เลย ไม่ต้องตั้งใหม่</div>
        <div class="tabs">
          <button class="tab ${tab==='types'?'active':''}" data-tab="types">ประเภทการ์ด</button>
          <button class="tab ${tab==='challenges'?'active':''}" data-tab="challenges">ชาเลนจ์</button>
          <button class="tab ${tab==='penalties'?'active':''}" data-tab="penalties">บทลงโทษ</button>
        </div>
        ${body}
      </div>
    </div>
  `;
}

/* ============ Event binding ============ */
function bindEvents(){
  document.querySelectorAll('.mode-tab').forEach(t=>{
    t.onclick = ()=>{ state.entryMode = t.getAttribute('data-mode'); state.entryError=''; render(); };
  });
  const myNameInput = document.getElementById('my-name-input');
  if(myNameInput) myNameInput.onchange = ()=>{ state.myName = myNameInput.value; saveProfile(state.myName, state.myPhoto); };
  const myPhotoBtn = document.getElementById('my-photo-btn');
  const myPhotoInput = document.getElementById('my-photo-input');
  if(myPhotoBtn && myPhotoInput){
    myPhotoBtn.onclick = ()=> myPhotoInput.click();
    myPhotoInput.onchange = ()=>{ const f=myPhotoInput.files&&myPhotoInput.files[0]; if(f) handleMyPhotoFile(f); };
  }
  const joinCodeInput = document.getElementById('join-code-input');
  if(joinCodeInput) joinCodeInput.oninput = ()=>{ state.joinCodeInput = joinCodeInput.value.toUpperCase(); };
  const entryBtn = document.getElementById('entry-action-btn');
  if(entryBtn) entryBtn.onclick = ()=>{
    if(myNameInput) state.myName = myNameInput.value;
    state.entryMode==='create' ? createRoom() : joinRoom();
  };

  const copyBtn = document.getElementById('copy-code-btn');
  if(copyBtn) copyBtn.onclick = ()=>{
    navigator.clipboard && navigator.clipboard.writeText(state.roomCode).catch(()=>{});
  };
  document.querySelectorAll('[data-transfer-host]').forEach(btn=>{
    btn.onclick = ()=> transferHost(btn.getAttribute('data-transfer-host'));
  });
  const hostStartBtn = document.getElementById('host-start-btn');
  if(hostStartBtn) hostStartBtn.onclick = hostStartGame;
  const leaveBtn = document.getElementById('leave-room-btn');
  if(leaveBtn) leaveBtn.onclick = leaveRoom;

  const revealOpenBtn = document.getElementById('reveal-open-btn');
  if(revealOpenBtn) revealOpenBtn.onclick = handleRevealOpenClick;
  const hostOpenAllBtn = document.getElementById('host-open-all-btn');
  if(hostOpenAllBtn) hostOpenAllBtn.onclick = hostOpenAll;
  const nextRoundBtn = document.getElementById('next-round-btn');
  if(nextRoundBtn) nextRoundBtn.onclick = hostNextRound;

  const openChallengeBtn = document.getElementById('open-challenge-btn');
  if(openChallengeBtn) openChallengeBtn.onclick = hostOpenChallenge;
  document.querySelectorAll('[data-loser-player]').forEach(btn=>{
    btn.onclick = ()=> hostToggleLoser(btn.getAttribute('data-loser-player'));
  });
  const confirmPenaltyBtn = document.getElementById('confirm-penalty-btn');
  if(confirmPenaltyBtn) confirmPenaltyBtn.onclick = hostConfirmPenalty;

  // Settings
  const settingsOverlay = document.getElementById('settings-overlay');
  if(settingsOverlay) settingsOverlay.onclick = (e)=>{ if(e.target===settingsOverlay) closeSettings(); };
  const closeSettingsBtn = document.getElementById('close-settings-btn');
  if(closeSettingsBtn) closeSettingsBtn.onclick = closeSettings;
  document.querySelectorAll('.tab').forEach(t=>{ t.onclick = ()=>{ state.settingsTab=t.getAttribute('data-tab'); render(); }; });

  document.querySelectorAll('.type-label-input').forEach(inp=>{
    inp.onchange = ()=> updateTypeLabel(inp.getAttribute('data-type-id'), inp.value);
  });
  document.querySelectorAll('[data-remove-type]').forEach(btn=>{ btn.onclick = ()=> removeType(btn.getAttribute('data-remove-type')); });
  const addTypeBtn = document.getElementById('add-type-btn');
  if(addTypeBtn) addTypeBtn.onclick = ()=> addType(document.getElementById('new-type-emoji').value, document.getElementById('new-type-label').value);

  document.querySelectorAll('[data-remove-challenge]').forEach(btn=>{ btn.onclick = ()=> removeChallenge(parseInt(btn.getAttribute('data-remove-challenge'))); });
  const addChallengeBtn = document.getElementById('add-challenge-btn');
  const newChallengeInput = document.getElementById('new-challenge-input');
  if(addChallengeBtn && newChallengeInput){
    addChallengeBtn.onclick = ()=> { addChallenge(newChallengeInput.value); };
    newChallengeInput.onkeydown = (e)=>{ if(e.key==='Enter') addChallenge(newChallengeInput.value); };
  }
  document.querySelectorAll('[data-remove-penalty]').forEach(btn=>{ btn.onclick = ()=> removePenalty(parseInt(btn.getAttribute('data-remove-penalty'))); });
  const addPenaltyBtn = document.getElementById('add-penalty-btn');
  const newPenaltyInput = document.getElementById('new-penalty-input');
  if(addPenaltyBtn && newPenaltyInput){
    addPenaltyBtn.onclick = ()=> { addPenalty(newPenaltyInput.value); };
    newPenaltyInput.onkeydown = (e)=>{ if(e.key==='Enter') addPenalty(newPenaltyInput.value); };
  }
}

/* ============ Housekeeping: delete stale rooms (older than 24h) ============ */
async function cleanupOldRooms(){
  if(!fbDb) return;
  try{
    const snap = await fbDb.ref('rooms').once('value');
    if(!snap.exists()) return;
    const ONE_DAY = 24*60*60*1000;
    const now = Date.now();
    const updates = {};
    snap.forEach(child=>{
      const val = child.val();
      const createdAt = val && val.meta && val.meta.createdAt;
      if(createdAt && (now - createdAt) > ONE_DAY){
        updates[child.key] = null; // deletes that room
      }
    });
    if(Object.keys(updates).length){
      await fbDb.ref('rooms').update(updates);
    }
  }catch(e){ console.error('ล้างห้องเก่าไม่สำเร็จ', e); }
}

/* ============ Init ============ */
cleanupOldRooms();
tryAutoRejoin();
